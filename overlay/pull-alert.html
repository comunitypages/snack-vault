<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snack Vault | Snack Pull Alert</title><link rel="stylesheet" href="shared.css"></head><body><main id="alert" class="glass hide" style="width:min(920px,90vw);min-height:330px;padding:48px;display:flex;align-items:center;gap:45px"><div id="emoji" style="font-size:150px;filter:drop-shadow(0 0 22px #d556ff)">🍬</div><section><div class="tag">SNACK VAULT • NEW PULL</div><p class="who" id="user" style="margin:25px 0 6px">Viewer</p><div class="snack" id="snack">MYSTERY SNACK</div><div class="tag" id="rarity" style="margin-top:18px">COMMON</div></section></main><script>let timer;document.addEventListener('snackvault:update',e=>{const d=e.detail;const a=document.getElementById('alert');document.getElementById('user').textContent=d.username+' pulled';document.getElementById('snack').textContent=d.snack;document.getElementById('emoji').textContent=d.emoji;const r=document.getElementById('rarity');r.textContent=d.rarity.toUpperCase();r.className='tag '+d.rarity.toLowerCase();a.classList.remove('hide','rise');void a.offsetWidth;a.classList.add('rise');clearTimeout(timer);timer=setTimeout(()=>a.classList.add('hide'),8000)});</script><script src="shared.js"></script></body></html>
