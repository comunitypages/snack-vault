<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snack Vault | Vending Machine</title><link rel="stylesheet" href="shared.css"></head><body><main class="glass rise" style="padding:28px 34px;display:flex;align-items:center;gap:35px;max-width:850px"><div class="machine" id="machine"><div class="shelves"><span>🍫</span><span>🍭</span><span>🌮</span><span>🍪</span><span>🍿</span><span>🌶️</span><span>🥨</span><span>🍬</span><span>🥤</span></div><div class="tray" id="tray">❔</div></div><section style="width:300px"><div class="tag">SNACK VAULT</div><h1 class="glow" style="font-size:38px;margin:18px 0 6px">VENDING MACHINE</h1><p class="tiny">THE NEXT PULL IS COMING...</p><div class="pill" style="margin-top:45px"><div class="label">LATEST PULL</div><p class="who" id="user">Waiting for a viewer</p><div class="snack" id="snack" style="font-size:30px">???</div><div class="tag" id="rarity">MYSTERY</div></div></section></main><script>document.addEventListener('snackvault:update',e=>{let d=e.detail;document.getElementById('user').textContent=d.username;document.getElementById('snack').textContent=d.snack;document.getElementById('rarity').textContent=d.rarity.toUpperCase();document.getElementById('tray').textContent=d.emoji;let m=document.getElementById('machine');m.classList.add('shaking');setTimeout(()=>m.classList.remove('shaking'),1200)});</script><script src="shared.js"></script></body></html>
