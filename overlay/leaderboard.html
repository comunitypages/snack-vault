<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snack Vault | Snack Leaderboard</title><link rel="stylesheet" href="shared.css"></head><body><main class="glass" style="width:min(700px,90vw);padding:35px 42px"><div class="tag">SNACK VAULT</div><h1 class="glow" style="font-size:42px;margin:15px 0 25px">TOP COLLECTORS</h1><div id="leaders"><div class="pill">Waiting for leaderboard data...</div></div><p class="tiny" style="margin-bottom:0">Collect snacks • Climb the ranks</p></main><script>document.addEventListener('snackvault:update',e=>{const d=e.detail;const el=document.getElementById('leaders');el.replaceChildren();const leaders=d.leaders.length?d.leaders:[{name:d.username,count:d.total||1}];leaders.slice(0,5).forEach((x,i)=>{const r=document.createElement('div');r.className='pill';r.style.cssText='display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:23px';const name=document.createElement('b');name.textContent=['🥇','🥈','🥉','🏅','🏅'][i]+' '+(x.name||x.username||'Viewer');const count=document.createElement('b');count.className='glow';count.textContent=String(x.count||x.total||0);r.append(name,count);el.append(r)})});</script><script src="shared.js"></script></body></html>
