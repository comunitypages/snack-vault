<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snack Vault — Vending Overlay v2</title>
<style>
:root{--accent:#ff279d;--accent2:#a638ff;--rarity:#d1d1da;--ink:#090513}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}#stage{position:relative;width:100vw;height:100vh;overflow:hidden;pointer-events:none}.aura{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 65%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 56%);opacity:0;transition:opacity .4s}.active .aura{opacity:1}.machine-wrap{position:absolute;left:50%;bottom:6%;width:min(33vw,440px);height:min(78vh,710px);transform:translate(-50%,115vh) scale(.8);opacity:0;transition:transform .8s cubic-bezier(.14,.85,.25,1.05),opacity .5s;filter:drop-shadow(0 0 28px color-mix(in srgb,var(--accent) 60%,transparent))}.active .machine-wrap{opacity:1;transform:translate(-50%,0) scale(1)}.machine{position:relative;width:100%;height:100%;border:7px solid #1b0c25;border-radius:25px;padding:25px 20px;background:linear-gradient(110deg,#25112e,#080610 65%,#260e2b);box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 25px #000,0 0 0 3px #090513}.sign{position:absolute;top:-34px;left:50%;transform:translateX(-50%) rotate(-2deg);z-index:6;white-space:nowrap;background:#100816;border:3px solid var(--accent);border-radius:9px;padding:7px 17px;font-size:clamp(19px,2.2vw,35px);font-weight:1000;text-shadow:0 0 12px var(--accent);box-shadow:0 0 20px var(--accent)}.window{position:relative;height:72%;width:83%;border:6px solid #07020c;border-radius:12px;background:linear-gradient(125deg,#230c2b,#070710 65%,#1c0a27);box-shadow:inset 0 0 18px var(--accent),0 0 0 2px #6c2777;overflow:hidden}.shelves{height:100%;padding:12px 9px;display:grid;grid-template-rows:repeat(3,1fr);gap:5px}.shelf{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:9px;padding:5px 5px 10px;border-bottom:5px solid #7b2c72;box-shadow:0 8px 9px -6px var(--accent);min-height:0}.slot{height:100%;display:grid;place-items:center;position:relative;min-width:0}.snack-pack{position:relative;width:83%;height:83%;max-height:130px;display:grid;place-items:center;transform:rotate(-4deg);filter:drop-shadow(0 5px 4px #0008);transition:opacity .25s}.slot:nth-child(2) .snack-pack{transform:rotate(4deg)}.snack-pack img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 5px #0008)}.snack-pack .fallback{width:100%;height:100%;display:grid;place-items:center;border:2px solid #ffffff55;border-radius:7px 7px 12px 12px;background:linear-gradient(140deg,var(--accent2),#3a1854);font-size:clamp(8px,.8vw,13px);font-weight:900;text-align:center;padding:5px;overflow:hidden;overflow-wrap:anywhere}.slot.selected .snack-pack{animation:wiggle .17s ease-in-out infinite alternate}.slot.dispensed .snack-pack{opacity:0}.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 15%,#ffffff20 23%,transparent 34%,transparent 65%,#ffffff13 70%,transparent 78%)}.keypad{position:absolute;right:2%;top:34%;width:13%;height:27%;border:2px solid var(--accent);border-radius:8px;background:#100819;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:7px;box-shadow:0 0 10px var(--accent)}.keypad i{background:#b16ad1;border-radius:2px}.tray{position:absolute;bottom:7%;left:16%;width:68%;height:13%;border:4px solid var(--accent);border-radius:7px 7px 18px 18px;background:linear-gradient(#08040c,#260c2a);box-shadow:0 0 18px var(--accent),inset 0 0 15px #000;display:grid;place-items:center;color:var(--accent);font-weight:1000;letter-spacing:1px;font-size:clamp(10px,1vw,16px)}.faller{position:absolute;z-index:8;left:0;top:0;width:85px;height:100px;object-fit:contain;opacity:0;pointer-events:none;filter:drop-shadow(0 0 14px var(--accent))}.faller.go{opacity:1;animation:dispense 1.15s cubic-bezier(.24,.65,.56,1) forwards}.machine-wrap.exit{transform:translate(-115%,0) scale(.66);opacity:.18}.reveal{position:absolute;z-index:12;left:50%;top:50%;width:min(61vw,970px);min-height:320px;transform:translate(-50%,-42%) scale(.68);opacity:0;transition:transform .55s cubic-bezier(.16,1.3,.26,1),opacity .4s;border:4px solid var(--rarity);border-radius:25px;background:linear-gradient(125deg,#130b20f7,#07040dfb 70%,#1b0a25f9);box-shadow:0 0 35px color-mix(in srgb,var(--rarity) 70%,transparent),inset 0 0 30px color-mix(in srgb,var(--rarity) 15%,transparent);padding:24px 30px 28px}.revealing .reveal{opacity:1;transform:translate(-50%,-50%) scale(1)}.reveal-title{text-align:center;color:var(--accent);font-weight:1000;letter-spacing:3px;font-size:clamp(18px,2.2vw,32px);text-shadow:0 0 14px var(--accent)}.reveal-row{display:flex;align-items:center;justify-content:center;gap:28px;margin:15px 0}.reveal-image{width:37%;height:min(30vh,260px);display:grid;place-items:center;flex-shrink:0}.reveal-image img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 20px var(--rarity))}.reveal-image .fallback{font-size:clamp(70px,10vw,160px)}.reveal-info{flex:1;min-width:0}.viewer{font-size:clamp(18px,2vw,31px);font-weight:900;overflow-wrap:anywhere}.pulled{color:var(--accent);font-size:clamp(17px,1.7vw,27px);font-weight:900}.snack-name{font-size:clamp(30px,3.5vw,61px);line-height:1.05;font-weight:1000;text-transform:uppercase;overflow-wrap:anywhere;text-shadow:0 0 10px var(--rarity)}.rarity{display:inline-block;margin-top:14px;border-radius:7px;padding:8px 20px;color:#0b0710;background:var(--rarity);font-weight:1000;letter-spacing:1px}.discovery{text-align:center;color:var(--rarity);font-weight:1000;font-size:clamp(16px,1.6vw,24px);letter-spacing:1px}.demo{position:fixed;z-index:100;left:15px;bottom:15px;pointer-events:auto;background:#160c20ed;border:1px solid var(--accent);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;font-size:12px}.demo[hidden]{display:none}.demo button,.demo select{padding:8px;background:#24142e;color:white;border:1px solid var(--accent);border-radius:6px;cursor:pointer}.spin .shelf{animation:shelfshake .13s linear infinite}@keyframes shelfshake{50%{transform:translateX(4px);filter:blur(1px)}}@keyframes wiggle{to{transform:translateX(5px) rotate(12deg)}}@keyframes dispense{0%{opacity:1;transform:translate(0,0) rotate(-6deg) scale(.75)}35%{transform:translate(15px,80px) rotate(18deg) scale(.95)}68%{transform:translate(2px,220px) rotate(150deg) scale(.9)}100%{opacity:0;transform:translate(5px,300px) rotate(240deg) scale(.6)}}@media(max-width:800px){.machine-wrap{width:60vw}.reveal{width:91vw}.reveal-row{gap:10px}.reveal-image{width:34%}}
</style>
</head><body>
<main id="stage"><div class="aura"></div><div class="machine-wrap" id="machineWrap"><div class="machine"><div class="sign" id="machineTitle">SNACK VAULT</div><div class="window"><div class="shelves" id="shelves"></div><div class="glass"></div></div><div class="keypad" id="keypad"></div><div class="tray" id="tray">PULLING SNACK…</div><img id="faller" class="faller" alt=""></div></div><section class="reveal"><div class="reveal-title" id="revealTitle">✦ SNACK VAULT ✦</div><div class="reveal-row"><div class="reveal-image" id="revealImage"></div><div class="reveal-info"><div class="viewer" id="viewer"></div><div class="pulled">pulled</div><div class="snack-name" id="snackName"></div><div class="rarity" id="rarity"></div></div></div><div class="discovery" id="discovery"></div></section></main>
<aside class="demo" id="demo" hidden><strong>PREVIEW</strong><select id="raritySelect"><option>Common</option><option>Uncommon</option><option>Rare</option><option>Epic</option><option>Legendary</option><option>Mythic</option></select><button id="pullBtn">▶ Pull snack</button></aside>
<script>
(()=>{'use strict';
const params=new URLSearchParams(location.search),$=id=>document.getElementById(id),stage=$('stage'),root=document.documentElement;
const hex=(v,d)=>/^#[0-9a-f]{6}$/i.test(v||'')?v:d;
root.style.setProperty('--accent',hex(params.get('color'),'#ff279d'));root.style.setProperty('--accent2',hex(params.get('secondary'),'#a638ff'));
const creator=(params.get('creator')||'').replace(/[^a-z0-9-]/gi,'').slice(0,60),brand=(params.get('brand')||'Snack Vault').slice(0,32);
$('machineTitle').textContent=brand.toUpperCase();$('revealTitle').textContent='✦ '+brand.toUpperCase()+' ✦';
for(let i=0;i<12;i++)$('keypad').appendChild(document.createElement('i'));
const rarityColors={common:'#c2c3d1',uncommon:'#41ec61',rare:'#20a9ff',epic:'#bc53ff',legendary:'#ffc72d',mythic:'#ff4a57'};
// Replace sample snacks with your creator's real catalog by passing ?catalog=https://YOUR-PUBLIC-JSON-URL
// Catalog format: [{"name":"Doritos","image_url":"https://.../doritos.png","rarity":"Common"}, ...]
const sample=[{name:'Doritos',emoji:'🔺'},{name:'Takis',emoji:'🌶️'},{name:'Cheetos',emoji:'🧀'},{name:'Kit Kat',emoji:'🍫'},{name:'Pringles',emoji:'🥔'},{name:'Sour Patch Kids',emoji:'🍬'},{name:'Reese’s',emoji:'🍫'},{name:'Skittles',emoji:'🌈'},{name:'Oreo',emoji:'🍪'}];
let catalog=sample.slice(),queue=[],busy=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),clean=(s,max=90)=>String(s??'').slice(0,max);
function imageURL(v){try{const u=new URL(String(v),location.href);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function normalize(s){return {name:clean(s.name||s.snack_name||s.snack||'Snack',65),image_url:imageURL(s.image_url||s.image||s.photo_url),emoji:clean(s.emoji||'🍿',6),rarity:clean(s.rarity||'Common',20)}}
function pack(s){const outer=document.createElement('div');outer.className='snack-pack';if(s.image_url){const img=document.createElement('img');img.src=s.image_url;img.alt=s.name;img.referrerPolicy='no-referrer';img.onerror=()=>{outer.replaceChildren();fallback(outer,s)};outer.append(img)}else fallback(outer,s);return outer}
function fallback(parent,s){const el=document.createElement('div');el.className='fallback';el.textContent=s.name;parent.append(el)}
function displayVisual(parent,s){parent.replaceChildren();if(s.image_url){const img=document.createElement('img');img.src=s.image_url;img.alt=s.name;img.referrerPolicy='no-referrer';img.onerror=()=>{parent.replaceChildren();const el=document.createElement('span');el.className='fallback';el.textContent=s.emoji;parent.append(el)};parent.append(img)}else{const el=document.createElement('span');el.className='fallback';el.textContent=s.emoji;parent.append(el)}}
function renderShelf(items){const shelfRoot=$('shelves');shelfRoot.replaceChildren();items.slice(0,9).forEach((s,i)=>{if(i%3===0){const row=document.createElement('div');row.className='shelf';shelfRoot.append(row)}const slot=document.createElement('div');slot.className='slot';slot.dataset.index=i;slot.append(pack(s));shelfRoot.lastElementChild.append(slot)})}
function topNine(){return catalog.slice(0,9)}
function fillNine(pull){const arr=topNine().slice();while(arr.length<9)arr.push(sample[arr.length%sample.length]);if(pull){const index=arr.findIndex(s=>s.name.toLowerCase()===pull.name.toLowerCase());if(index<0)arr[4]=pull;else arr[index]=pull}return arr}
function pickIndex(arr,pull){let index=arr.findIndex(s=>s.name.toLowerCase()===pull.name.toLowerCase());return index<0?4:index}
async function animate(raw){busy=true;const pull=normalize(raw),arr=fillNine(pull),index=pickIndex(arr,pull);renderShelf(arr);stage.className='';$('machineWrap').classList.remove('exit');$('faller').classList.remove('go');$('tray').textContent='PULLING SNACK…';root.style.setProperty('--rarity',rarityColors[pull.rarity.toLowerCase()]||rarityColors.common);
$('viewer').textContent=clean(raw.username||raw.display_name||'Viewer',60);$('snackName').textContent=pull.name;$('rarity').textContent=pull.rarity.toUpperCase();displayVisual($('revealImage'),pull);
const count=Number(raw.count??raw.quantity??1);$('discovery').textContent=raw.is_new===true||raw.new===true?'✦ NEW SNACK DISCOVERED! ✦':Number.isFinite(count)&&count>1?'DUPLICATE · YOU NOW HAVE x'+Math.floor(count):'✦ SNACK UNLOCKED! ✦';
await wait(60);stage.classList.add('active');await wait(950);stage.classList.add('spin');await wait(1300);stage.classList.remove('spin');const slot=$('shelves').querySelector('[data-index="'+index+'"]');slot.classList.add('selected');await wait(500);slot.classList.remove('selected');slot.classList.add('dispensed');const img=slot.querySelector('img');const faller=$('faller');if(img&&pull.image_url){faller.src=pull.image_url;faller.style.display='block'}else{faller.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="90" height="110"><rect x="5" y="5" width="80" height="100" rx="12" fill="#ac298e" stroke="#fff" stroke-width="3"/><text x="45" y="58" fill="white" font-size="12" text-anchor="middle">SNACK</text></svg>');faller.style.display='block'}
// Position falling product relative to the machine using the selected shelf slot.
const machineRect=$('machineWrap').getBoundingClientRect(),slotRect=slot.getBoundingClientRect();faller.style.left=(slotRect.left-machineRect.left+slotRect.width/2-42)+'px';faller.style.top=(slotRect.top-machineRect.top)+'px';faller.classList.add('go');await wait(1200);$('tray').textContent='SNACK DISPENSED!';await wait(350);$('machineWrap').classList.add('exit');stage.classList.add('revealing');await wait(Math.min(Math.max(Number(params.get('hold'))||4500,1000),15000));stage.className='';$('machineWrap').classList.remove('exit');faller.classList.remove('go');await wait(550);busy=false;if(queue.length)animate(queue.shift())}
function play(pull){if(!pull||typeof pull!=='object')return;queue.push(pull);if(!busy)animate(queue.shift())}
window.SnackVaultOverlay={play,setCatalog(snacks){if(Array.isArray(snacks)&&snacks.length){catalog=snacks.map(normalize);renderShelf(fillNine())}},creator};
renderShelf(fillNine());
window.addEventListener('message',e=>{if(e.source===window&&e.data?.type==='SNACK_VAULT_PULL')play(e.data.pull)});
const catalogURL=imageURL(params.get('catalog'));if(catalogURL){fetch(catalogURL,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Catalog unavailable');return r.json()}).then(data=>{const snacks=Array.isArray(data)?data:Array.isArray(data.snacks)?data.snacks:[];if(snacks.length)window.SnackVaultOverlay.setCatalog(snacks)}).catch(e=>console.warn('Catalog:',e.message))}
if(params.has('demo')){$('demo').hidden=false;$('pullBtn').addEventListener('click',()=>{const s=catalog[Math.floor(Math.random()*catalog.length)]||sample[0];play({...s,username:params.get('viewer')||'underscorepower',rarity:$('raritySelect').value,is_new:true})});setTimeout(()=>$('pullBtn').click(),500)}
// Optional public feed returns {events:[{id,username,snack_name,image_url,rarity,...}]}.
const feed=imageURL(params.get('feed'));if(feed){let seen=new Set(),first=true;async function poll(){try{const r=await fetch(feed,{cache:'no-store'});if(!r.ok)return;const d=await r.json(),events=Array.isArray(d)?d:Array.isArray(d.events)?d.events:[];for(const event of events.slice().reverse()){if(event.id==null)continue;const id=String(event.id);if(!seen.has(id)&&!first)play(event);seen.add(id)}first=false;if(seen.size>300)seen=new Set([...seen].slice(-150))}catch(e){console.warn('Feed:',e.message)}}poll();setInterval(poll,2500)}
})();
</script>
</body></html>
