<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snack Vault · Vending Pull Overlay</title>
<style>
:root{--accent:#ff279d;--accent2:#a638ff;--ink:#080512;--text:#fff;--rarity:#b6b7c6}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;pointer-events:none}.effect{position:absolute;inset:0;opacity:0;transition:opacity .35s;background:radial-gradient(ellipse at 50% 68%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 48%)}.stage.active .effect{opacity:1}.machine-wrap{position:absolute;left:50%;bottom:9%;width:min(30vw,450px);height:min(77vh,740px);transform:translate(-50%,120vh) scale(.83);filter:drop-shadow(0 0 35px color-mix(in srgb,var(--accent) 50%,transparent));transition:transform .85s cubic-bezier(.15,.85,.25,1.1),opacity .5s;opacity:0}.stage.active .machine-wrap{transform:translate(-50%,0) scale(1);opacity:1}.machine{height:100%;border:8px solid #28102f;border-radius:24px;background:linear-gradient(115deg,#26142d,#090713 55%,#341134);box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 25px #000,0 0 0 4px #08040e;position:relative;padding:18px 20px 26px}.sign{position:absolute;z-index:3;left:50%;top:-39px;transform:translateX(-50%) rotate(-2deg);white-space:nowrap;background:#100817;border:3px solid var(--accent);border-radius:9px;padding:8px 18px;font-weight:1000;font-size:clamp(18px,2.2vw,37px);letter-spacing:-1px;text-shadow:0 0 13px var(--accent);box-shadow:0 0 20px var(--accent)}.window{height:71%;border:7px solid #08030f;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(110deg,#1b0820,#080811 65%,#2c1239);box-shadow:inset 0 0 20px var(--accent),0 0 0 2px #502053}.shelves{height:100%;display:flex;flex-direction:column;justify-content:space-evenly;padding:14px}.shelf{height:28%;display:flex;gap:10px;align-items:center;justify-content:space-around;border-bottom:5px solid #763065;box-shadow:0 8px 10px -7px var(--accent)}.packet{height:82%;width:27%;border:2px solid #ffffff30;border-radius:8px 8px 15px 15px;display:flex;justify-content:center;align-items:center;text-align:center;font-size:clamp(9px,1vw,15px);font-weight:1000;text-shadow:0 2px 4px #000;box-shadow:inset -10px -4px 13px #0005,0 0 10px #0008;transform:rotate(-4deg);padding:4px;line-height:1.05}.packet:nth-child(even){transform:rotate(5deg)}.packet:nth-child(3n+1){background:linear-gradient(135deg,#f04d27,#a40e31)}.packet:nth-child(3n+2){background:linear-gradient(135deg,#7a3dfb,#251188)}.packet:nth-child(3n){background:linear-gradient(135deg,#ffa724,#e24714)}.glass{position:absolute;inset:0;background:linear-gradient(120deg,transparent 12%,#fff2 22%,transparent 31%,transparent 62%,#fff1 66%,transparent 74%);pointer-events:none}.controls{position:absolute;right:18px;top:38%;width:15%;height:26%;border:2px solid var(--accent);background:#100918;border-radius:9px;display:flex;flex-wrap:wrap;gap:5px;align-content:center;justify-content:center;box-shadow:0 0 12px var(--accent)}.key{width:20%;height:13%;background:#b66ed9;border-radius:2px}.tray{position:absolute;bottom:8%;left:17%;width:66%;height:12%;background:linear-gradient(#09040d,#28102d);border:4px solid var(--accent);border-radius:6px 6px 17px 17px;box-shadow:0 0 19px var(--accent),inset 0 0 12px #000}.tray:before{content:'PULLING SNACK…';position:absolute;left:0;right:0;top:25%;text-align:center;color:var(--accent);font-size:clamp(9px,1.05vw,16px);font-weight:1000;letter-spacing:1px}.stage.spin .shelves{animation:spin .12s linear infinite}.stage.spin .machine{animation:shake .12s linear infinite}.stage.drop .packet.falling{animation:fall .85s ease-in forwards;z-index:4}.reveal{position:absolute;left:50%;top:50%;width:min(55vw,890px);min-height:300px;transform:translate(-50%,-42%) scale(.6);opacity:0;transition:opacity .45s,transform .65s cubic-bezier(.2,1.4,.25,1);background:linear-gradient(125deg,#100a1deF,#07040ef7 70%,#180a23ef);border:4px solid var(--rarity);border-radius:24px;box-shadow:0 0 28px var(--rarity),inset 0 0 30px color-mix(in srgb,var(--rarity) 18%,transparent);padding:22px 30px 30px;display:flex;flex-direction:column;gap:15px}.stage.revealing .reveal{opacity:1;transform:translate(-50%,-50%) scale(1)}.stage.revealing .machine-wrap{transform:translate(-105%,0) scale(.62);opacity:.18}.reveal-head{text-align:center;font-weight:1000;font-size:clamp(18px,2vw,30px);color:var(--accent);letter-spacing:3px;text-shadow:0 0 15px var(--accent)}.reveal-main{display:flex;align-items:center;gap:25px;justify-content:center}.snack-visual{flex:0 0 36%;height:min(28vh,230px);display:grid;place-items:center;position:relative}.snack-visual img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 20px var(--rarity))}.snack-emoji{font-size:clamp(85px,10vw,170px);filter:drop-shadow(0 0 20px var(--rarity))}.reveal-info{flex:1;min-width:0}.viewer{font-weight:850;font-size:clamp(18px,2vw,31px);overflow-wrap:anywhere}.verb{font-size:clamp(16px,1.6vw,25px);color:var(--accent);font-weight:800}.snack-name{font-size:clamp(30px,3.3vw,57px);font-weight:1000;line-height:1.08;text-transform:uppercase;overflow-wrap:anywhere;text-shadow:0 0 12px color-mix(in srgb,var(--rarity) 60%,transparent)}.rarity{display:inline-block;background:var(--rarity);color:#080710;padding:7px 19px;border-radius:7px;font-weight:1000;letter-spacing:1px;margin-top:14px}.discovery{text-align:center;font-size:clamp(15px,1.5vw,23px);font-weight:900;letter-spacing:1px;color:var(--rarity)}.spark{position:absolute;left:50%;top:50%;height:8px;width:8px;border-radius:50%;background:var(--rarity);opacity:0}.stage.revealing .spark{animation:spark .9s ease-out both;animation-delay:var(--delay)}.demo-controls{position:fixed;bottom:15px;left:15px;z-index:30;pointer-events:auto;display:flex;gap:8px;align-items:center;background:#130c1fe8;padding:10px;border:1px solid #f5a1ff55;border-radius:10px;font-size:12px}.demo-controls button,.demo-controls select{background:#24132f;color:#fff;border:1px solid var(--accent);padding:8px;border-radius:6px;cursor:pointer}.demo-controls[hidden]{display:none!important}@keyframes spin{50%{filter:blur(5px);transform:translateY(-4px)}}@keyframes shake{50%{transform:translateX(5px)}}@keyframes fall{to{transform:translateY(230px) rotate(55deg);opacity:0}}@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateX(0)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d))}}@media(max-width:750px){.machine-wrap{width:60vw}.reveal{width:90vw}.reveal-main{gap:8px}.snack-visual{flex-basis:32%}}
</style></head><body><main class="stage" id="stage"><div class="effect"></div><div class="machine-wrap"><div class="machine"><div class="sign" id="machineTitle">SNACK VAULT</div><div class="window"><div class="shelves" id="shelves"><div class="shelf"><div class="packet">CHIPS</div><div class="packet">CANDY</div><div class="packet">CRUNCH</div></div><div class="shelf"><div class="packet">SOUR</div><div class="packet">COOKIES</div><div class="packet">TAKIS</div></div><div class="shelf"><div class="packet">SWEETS</div><div class="packet">CHOC</div><div class="packet">SNACKS</div></div></div><div class="glass"></div></div><div class="controls" id="controls"></div><div class="tray"></div></div></div><section class="reveal"><div class="reveal-head" id="revealTitle">✦ SNACK VAULT ✦</div><div class="reveal-main"><div class="snack-visual" id="snackVisual"><span class="snack-emoji">🍿</span></div><div class="reveal-info"><div class="viewer" id="viewer">underscorepower</div><div class="verb">pulled</div><div class="snack-name" id="snackName">Doritos</div><div class="rarity" id="rarity">COMMON</div></div></div><div class="discovery" id="discovery">NEW SNACK DISCOVERED!</div></section></main><aside class="demo-controls" id="demoControls" hidden><span>PREVIEW</span><select id="demoRarity"><option>Common</option><option>Uncommon</option><option>Rare</option><option>Epic</option><option>Legendary</option><option>Mythic</option></select><button id="demoBtn">▶ Pull snack</button></aside>
<script>
(()=>{'use strict';const params=new URLSearchParams(location.search);const root=document.documentElement,stage=document.getElementById('stage');const $=id=>document.getElementById(id);const safeColor=(value,fallback)=>/^#[0-9a-fA-F]{6}$/.test(value||'')?value:fallback;const theme=safeColor(params.get('color'),'#ff279d');root.style.setProperty('--accent',theme);root.style.setProperty('--accent2',safeColor(params.get('secondary'),'#a638ff'));const creator=(params.get('creator')||'').replace(/[^a-z0-9-]/gi,'').slice(0,60);const brand=(params.get('brand')||'Snack Vault').slice(0,36);$('machineTitle').textContent=brand.toUpperCase();$('revealTitle').textContent='✦ '+brand.toUpperCase()+' ✦';for(let i=0;i<12;i++){const el=document.createElement('i');el.className='key';$('controls').appendChild(el)}for(let i=0;i<26;i++){const el=document.createElement('i');el.className='spark';el.style.setProperty('--a',`${i*360/26}deg`);el.style.setProperty('--d',`${140+(i%5)*32}px`);el.style.setProperty('--delay',`${(i%4)*.07}s`);stage.appendChild(el)}const rarityColors={common:'#c2c3d1',uncommon:'#41ec61',rare:'#20a9ff',epic:'#bc53ff',legendary:'#ffc72d',mythic:'#ff4a57'};const queue=[];let playing=false;const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));const clean=(s,max=80)=>String(s??'').slice(0,max);const reset=()=>stage.className='stage';async function run(pull){playing=true;const rarity=clean(pull.rarity||'Common',20).toLowerCase();root.style.setProperty('--rarity',rarityColors[rarity]||rarityColors.common);$('viewer').textContent=clean(pull.username||pull.display_name||'Viewer',60);$('snackName').textContent=clean(pull.snack_name||pull.snack||'Mystery Snack',70);$('rarity').textContent=rarity.toUpperCase();const count=Number(pull.count??pull.quantity??1);$('discovery').textContent=pull.is_new===true||pull.new===true?'✦ NEW SNACK DISCOVERED! ✦':Number.isFinite(count)&&count>1?`DUPLICATE · YOU NOW HAVE x${Math.floor(count)}`:'✦ SNACK UNLOCKED! ✦';const visual=$('snackVisual');visual.replaceChildren();const url=String(pull.image_url||'');if(/^https:\/\//i.test(url)){const img=document.createElement('img');img.src=url;img.alt='Snack';img.onerror=()=>{visual.replaceChildren();const emoji=document.createElement('span');emoji.className='snack-emoji';emoji.textContent=clean(pull.emoji||'🍿',5);visual.append(emoji)};visual.append(img)}else{const emoji=document.createElement('span');emoji.className='snack-emoji';emoji.textContent=clean(pull.emoji||'🍿',5);visual.append(emoji)}reset();await wait(80);stage.classList.add('active');await wait(1050);stage.classList.add('spin');await wait(1500);stage.classList.remove('spin');stage.classList.add('drop');await wait(900);stage.classList.add('revealing');await wait(Math.min(Math.max(Number(params.get('hold'))||4600,1000),15000));reset();await wait(650);playing=false;if(queue.length)run(queue.shift())}function play(pull){if(!pull||typeof pull!=='object')return;queue.push(pull);if(!playing)run(queue.shift())}window.SnackVaultOverlay={play,creator};window.addEventListener('message',e=>{if(e.source!==window)return;if(e.data?.type==='SNACK_VAULT_PULL')play(e.data.pull)});const demo=params.has('demo');if(demo){$('demoControls').hidden=false;$('demoBtn').addEventListener('click',()=>play({username:params.get('viewer')||'underscorepower',snack_name:'Doritos',rarity:$('demoRarity').value,emoji:'🍿',is_new:true}));setTimeout(()=>$('demoBtn').click(),500)}
// Optional public event feed: endpoint must return JSON {events:[{id,username,snack_name,rarity,...}]}; no secret keys in URL.
const feed=params.get('feed');if(feed&&/^https:\/\//i.test(feed)){let seen=new Set(),first=true;const poll=async()=>{try{const res=await fetch(feed,{cache:'no-store'});if(!res.ok)return;const data=await res.json();const events=Array.isArray(data)?data:Array.isArray(data.events)?data.events:[];for(const event of events.slice().reverse()){if(!event.id)continue;const id=String(event.id);if(!seen.has(id)&&!first)play(event);seen.add(id)}first=false;if(seen.size>300)seen=new Set([...seen].slice(-150))}catch(e){console.warn('Snack Vault feed unavailable',e.message)}};poll();setInterval(poll,2500)}
})();
</script></body></html>
