<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snack Vault | Snack Collection</title><link rel="stylesheet" href="shared.css"></head><body><main class="glass" style="width:min(820px,90vw);padding:30px 36px"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="tag">SNACK VAULT</div><h1 class="glow" style="font-size:38px;margin:14px 0">COLLECTION</h1></div><div class="pill"><div class="tiny">TOTAL PULLS</div><div class="snack" id="total" style="font-size:50px">0</div></div></div><div id="items" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px"><div class="pill">🍬 Waiting for collection data</div></div></main><script>document.addEventListener('snackvault:update',e=>{const d=e.detail;document.getElementById('total').textContent=d.total||'—';const el=document.getElementById('items');el.replaceChildren();const items=d.items.length?d.items:[{name:d.snack,emoji:d.emoji,count:1}];items.slice(0,9).forEach(x=>{const c=document.createElement('div');c.className='pill';const em=document.createElement('div');em.style.fontSize='35px';em.textContent=x.emoji||'🍬';const n=document.createElement('div');n.style.fontWeight='800';n.textContent=x.name||'Snack';const ct=document.createElement('div');ct.className='tiny';ct.textContent='Owned: '+(x.count||1);c.append(em,n,ct);el.append(c)})});</script><script src="shared.js"></script></body></html>
